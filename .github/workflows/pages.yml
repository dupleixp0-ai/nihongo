# Publie l'appli sur GitHub Pages à chaque envoi sur la branche main (et à la demande, onglet Actions).
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # Vérifie les données et les tests, construit l'appli statique (dossier out/) et le service worker.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Phase de test : pas d'indexation par les moteurs de recherche.
          NEXT_PUBLIC_NOINDEX: "1"
          # Dépôt public : les tracés KanjiVG (CC BY-SA 3.0) y sont publiés, la page Licences y renvoie.
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # Refuse de publier s'il manque une information légale.
          LEGAL_STRICT: "1"
          # Facultatif : identifiant Google pour la sauvegarde Drive (Settings → Secrets and variables → Actions → Variables).
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
